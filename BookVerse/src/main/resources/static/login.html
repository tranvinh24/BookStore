<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Góc Của Vin</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 440px;">
      <div class="panel" style="margin-top: 2rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin: 0;">Đăng nhập</h1>
        </div>

        <form id="login-form">
          <div class="field">
            <label class="field-label" for="username">Tên đăng nhập <span class="required">*</span></label>
            <input type="text" id="username" class="field-input" placeholder="Nhập tên đăng nhập" required autofocus />
            <div id="username-error" class="field-error"></div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Mật khẩu <span class="required">*</span></label>
            <input type="password" id="password" class="field-input" placeholder="Nhập mật khẩu" required />
            <div id="password-error" class="field-error"></div>
          </div>

          <div id="form-general-error" class="field-error" style="margin-bottom: 1rem; text-align: center;"></div>

          <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
            Đăng nhập
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--ink-secondary);">
          Chưa có tài khoản? <a href="/register.html" style="color: var(--ribbon-marigold); font-weight: 600;">Đăng ký ngay</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© 2026 Góc Của Vin. Nền tảng sách trực tuyến.</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
