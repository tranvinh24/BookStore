<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản — Góc Của Vin</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 480px;">
      <div class="panel" style="margin-top: 1.5rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin: 0;">Đăng ký tài khoản</h1>
        </div>

        <form id="register-form">
          <div class="field">
            <label class="field-label" for="userName">Tên đăng nhập <span class="required">*</span></label>
            <input type="text" id="userName" class="field-input" placeholder="Từ 3-20 ký tự" required autofocus />
            <div id="userName-error" class="field-error"></div>
          </div>

          <div class="field">
            <label class="field-label" for="email">Địa chỉ Email <span class="required">*</span></label>
            <input type="email" id="email" class="field-input" placeholder="vidu@example.com" required />
            <div id="email-error" class="field-error"></div>
          </div>

          <div class="field">
            <label class="field-label" for="sdt">Số điện thoại (tùy chọn)</label>
            <input type="tel" id="sdt" class="field-input" placeholder="Ví dụ: 0901234567" />
            <div id="sdt-error" class="field-error"></div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Mật khẩu <span class="required">*</span></label>
            <input type="password" id="password" class="field-input" placeholder="Tối thiểu 6 ký tự" required />
            <div id="password-error" class="field-error"></div>
          </div>

          <div class="field">
            <label class="field-label" for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
            <input type="password" id="confirmPassword" class="field-input" placeholder="Nhập lại mật khẩu" required />
            <div id="confirmPassword-error" class="field-error"></div>
          </div>

          <div id="form-general-error" class="field-error" style="margin-bottom: 1rem; text-align: center;"></div>

          <button type="submit" id="btn-submit" class="btn btn-accent btn-block btn-lg" style="margin-top: 0.5rem;">
            Đăng ký tài khoản
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--ink-secondary);">
          Đã có tài khoản? <a href="/login.html" style="color: var(--ink); font-weight: 600;">Đăng nhập ngay</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© 2026 Góc Của Vin. Nền tảng sách trực tuyến.</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
