<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng — Góc Của Vin Admin</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header"></header>

  <main class="main-content">
    <div class="container">
      
      <div style="text-align: center; margin: 1.75rem 0 2rem 0;">
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em; margin: 0;">Danh sách người dùng</h1>
      </div>

      <div class="admin-layout">
        
        <aside class="admin-sidebar">
          <a href="/admin/dashboard.html" class="admin-nav-item">Tổng quan</a>
          <a href="/admin/books.html" class="admin-nav-item">Quản lý sách & Kho</a>
          <a href="/admin/orders.html" class="admin-nav-item">Quản lý đơn hàng</a>
          <a href="/admin/users.html" class="admin-nav-item active">Quản lý người dùng</a>
          <div class="dropdown-divider" style="margin: 1rem 0;"></div>
          <a href="/index.html" class="admin-nav-item">Xem trang bán hàng</a>
        </aside>

        <section>
          
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Người dùng</th>
                  <th>Email</th>
                  <th>Số điện thoại</th>
                  <th>Vai trò</th>
                  <th>Ngày tham gia</th>
                  <th style="text-align: right;">Hành động</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr><td colspan="6" style="text-align: center; padding: 2rem;">Đang tải danh sách người dùng...</td></tr>
              </tbody>
            </table>
          </div>

        </section>

      </div>
    </div>
  </main>

  <!-- Edit User Modal -->
  <div id="user-modal" class="modal-backdrop">
    <div class="modal-dialog" style="max-width: 480px;">
      <div class="panel-header">
        <h3>Chỉnh sửa tài khoản người dùng</h3>
        <button id="btn-close-user-modal" class="btn btn-outline btn-sm btn-icon">✕</button>
      </div>

      <form id="user-edit-form">
        <input type="hidden" id="edit-user-id" />

        <div style="margin-bottom: 1.25rem;">
          <label class="field-label">Tên đăng nhập</label>
          <input type="text" id="edit-username" class="field-input" disabled style="opacity: 0.7;" />
        </div>

        <div class="field">
          <label class="field-label" for="edit-email">Email</label>
          <input type="email" id="edit-email" class="field-input" required />
          <div id="email-error" class="field-error"></div>
        </div>

        <div class="field">
          <label class="field-label" for="edit-sdt">Số điện thoại</label>
          <input type="tel" id="edit-sdt" class="field-input" placeholder="0901234567" />
          <div id="sdt-error" class="field-error"></div>
        </div>

        <div class="field">
          <label class="field-label" for="edit-role">Phân quyền vai trò <span class="required">*</span></label>
          <select id="edit-role" class="field-select" required>
            <option value="ROLE_USER">Độc giả (ROLE_USER)</option>
            <option value="ROLE_ADMIN">Quản trị viên (ROLE_ADMIN)</option>
          </select>
        </div>

        <div id="user-modal-error" class="field-error" style="margin-bottom: 1rem;"></div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="btn-cancel-user-modal" class="btn btn-outline">Hủy</button>
          <button type="submit" id="btn-save-user" class="btn btn-primary">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© 2026 Góc Của Vin Admin Portal.</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/admin-users.js"></script>
</body>
</html>
