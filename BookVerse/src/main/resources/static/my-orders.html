<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử đơn hàng — Góc Của Vin</title>
  <link rel="icon" type="image/png" href="/images/logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* Centered Header */
    .orders-page-header {
      text-align: center;
      margin: 1.75rem 0 2.5rem 0;
    }
    .orders-page-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin: 0;
    }

    /* Order Card Container */
    .order-card {
      background: var(--bg-card, #FFFFFF);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .order-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #CBD5E1;
    }

    /* Order Card Header */
    .order-card-header {
      background: #FAFBFC;
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .order-header-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .order-id-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .order-id-label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .order-id-val {
      font-weight: 700;
      color: var(--text-main);
      font-size: 1.05rem;
    }
    .order-date-line {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .order-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Card Body */
    .order-card-body {
      padding: 1.5rem;
    }

    /* Info Grid (Address & Payment) */
    .order-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      background: var(--bg-subtle, #F9FAFB);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.25rem;
      margin: 1.25rem 0;
    }
    .order-info-block {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .order-info-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .order-info-content {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.45;
      font-weight: 500;
    }
    .order-tracking-banner {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px dashed var(--border);
      padding-top: 0.65rem;
      margin-top: 0.25rem;
      font-size: 0.88rem;
      color: #1E40AF;
    }

    /* Products Section */
    .order-products-section {
      margin-top: 1.5rem;
    }
    .order-products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .order-products-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    .order-products-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .order-products-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Individual Product Card (Distinctly Separated & Balanced) */
    .order-product-card {
      display: grid;
      grid-template-columns: 62px 1fr 100px 140px 95px;
      align-items: center;
      gap: 1.25rem;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.9rem 1.15rem;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .order-product-card:hover {
      border-color: #CBD5E1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      background: #FAFBFC;
    }

    /* Product Cover */
    .product-cover-box {
      width: 62px;
      height: 85px;
      background: var(--bg-subtle, #F9FAFB);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Product Details */
    .product-details {
      min-width: 0;
    }
    .product-title-link {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text-main);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.38;
      transition: color 0.15s ease;
    }
    .product-title-link:hover {
      color: var(--primary);
    }
    .product-author-text {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .product-unit-price {
      font-size: 0.83rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* Product Quantity Column */
    .product-qty-col {
      text-align: center;
    }
    .product-col-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      display: block;
    }
    .product-qty-badge {
      display: inline-block;
      background: #F3F4F6;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.2rem 0.65rem;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    /* Product Subtotal Column */
    .product-subtotal-col {
      text-align: right;
    }
    .product-subtotal-amount {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Product Action Column */
    .product-action-col {
      text-align: right;
    }
    .btn-view-product {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.42rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-view-product:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }

    /* Order Card Footer */
    .order-card-footer {
      background: #FAFBFC;
      border-top: 1px solid var(--border);
      padding: 1.15rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .order-footer-total {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .order-total-label {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }
    .order-total-amount {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
    }
    .order-footer-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Responsive */
    @media (max-width: 820px) {
      .order-info-grid {
        grid-template-columns: 1fr;
      }
      .order-product-card {
        grid-template-columns: 60px 1fr;
        gap: 0.85rem;
        padding: 0.9rem;
      }
      .product-qty-col,
      .product-subtotal-col,
      .product-action-col {
        grid-column: 2 / 3;
      }
      .product-qty-col {
        text-align: left;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .product-col-label {
        display: inline;
        margin-bottom: 0;
      }
      .product-subtotal-col {
        text-align: left;
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .product-action-col {
        text-align: left;
        margin-top: 0.25rem;
      }
      .order-card-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .order-footer-total {
        justify-content: space-between;
      }
      .order-footer-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <header class="header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 960px;">
      <!-- Centered Page Title (No Subtitle) -->
      <div class="orders-page-header">
        <h1 class="orders-page-title">Lịch sử đơn hàng</h1>
      </div>

      <div id="orders-loading" class="panel" style="text-align: center; padding: 3rem;">
        <p>Đang tải danh sách đơn hàng...</p>
      </div>

      <!-- Empty state -->
      <div id="orders-empty" class="panel" style="display: none; text-align: center; padding: 4rem 2rem;">
        <div style="font-size: 3rem; margin-bottom: 0.5rem;">📦</div>
        <h3>Bạn chưa có đơn hàng nào</h3>
        <p style="margin-top: 0.4rem; color: var(--text-secondary);">Hãy chọn những cuốn sách bạn yêu thích và bắt đầu đặt hàng nhé!</p>
        <a href="/index.html" class="btn btn-primary" style="margin-top: 1.25rem;">Khám phá sách ngay</a>
      </div>

      <!-- Orders List Container -->
      <div id="orders-list-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <span>© 2026 Góc Của Vin. Nền tảng sách trực tuyến.</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/my-orders.js"></script>
</body>
</html>
