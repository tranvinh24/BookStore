server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookstore}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

# Cấu hình thư mục upload và các tùy chọn của ứng dụng
app:
  upload:
    dir: uploads/covers
    allowed-types: image/jpeg,image/png,image/webp