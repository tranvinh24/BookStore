server:
  port: 8080
  tomcat:
    max-swallow-size: -1        # -1 = không giới hạn (fix lỗi 413 từ Tomcat)

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookstore}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB       # Giới hạn mỗi file upload
      max-request-size: 25MB    # Giới hạn toàn bộ request

# Cấu hình thư mục upload và các tùy chọn của ứng dụng
app:
  upload:
    dir: uploads/covers
    allowed-types: image/jpeg,image/png,image/webp,image/gif
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBib29rdmVyc2UgYXBwbGljYXRpb24h}
    expiration: 86400000   # 24 giờ tính theo milliseconds